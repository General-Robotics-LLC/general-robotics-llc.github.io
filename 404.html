<!doctype html>
<!-- General Robotics — page shown when an address does not exist. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — General Robotics</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    /* Centre the short message in the window. */
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .lost img { width: 6rem; margin: 0 auto 2rem; }
    .lost h1 { font-size: var(--step-3); margin-bottom: 1rem; }
    .lost .actions { justify-content: center; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img src="/assets/img/emblem-b.svg" alt="" width="96" height="96">
      <p class="label">Page not found</p>
      <h1>This page has taken flight.</h1>
      <p>The address you followed does not exist on this site.</p>
      <div class="actions"><a class="button" href="/">Return home</a></div>
    </div>
  </main>
</body>
</html>
